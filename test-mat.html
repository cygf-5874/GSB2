<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<canvas id="c" width="400" height="400"></canvas>
<script type="module">
import * as THREE from '/lib/three.module.js';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), preserveDrawingBuffer: true });
renderer.setSize(400,400);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(50,1,.1,300);
camera.up.set(0,0,-1); camera.position.set(0,30,-0.01); camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x506040,0.9));
const sun = new THREE.DirectionalLight(0xfff2d0,1.1); sun.position.set(40,60,20); scene.add(sun);
// 单根柱体 0,0
const geo = new THREE.BoxGeometry(1,8,1);
const top = new THREE.MeshLambertMaterial({color:0x7db454});
const side = new THREE.MeshLambertMaterial({color:0x6b4a2e});
const m = new THREE.Mesh(geo,[side,side,top,side,side,side]);
m.position.y=4; scene.add(m);
renderer.render(scene,camera);
const c2=document.createElement('canvas');c2.width=400;c2.height=400;
c2.getContext('2d').drawImage(renderer.domElement,0,0);
const ctx=c2.getContext('2d');
window.__c=[...ctx.getImageData(200,200,1,1).data];
window.__done=true;
</script></body></html>
